name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Cache code-server resources
        uses: actions/cache@v5
        with:
          path: resources/code-server/vendor
          key: code-server-${{ hashFiles('config/scripts/prepare-code-server-resource.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare embedded code-server resources
        run: pnpm run prepare:code-server

      - name: Build Windows installer
        run: pnpm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-installer-${{ github.run_number }}
          path: dist/orca-windows-setup.exe
          if-no-files-found: error
          retention-days: 14
