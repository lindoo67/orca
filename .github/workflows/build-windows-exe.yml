name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-windows-exe-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORCA_GITHUB_OWNER: ${{ github.repository_owner }}
      ORCA_GITHUB_REPO: ${{ github.event.repository.name }}
      ORCA_GITHUB_RELEASE_TYPE: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Cache code-server resources
        uses: actions/cache@v5
        with:
          path: resources/code-server/vendor
          key: code-server-${{ hashFiles('config/scripts/prepare-code-server-resource.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Why here: build:desktop builds out/mobile-web, whose esbuild entry resolves RN/Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Prepare embedded code-server resources
        run: pnpm run prepare:code-server

      - name: Resolve release version from tag
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if ($env:REQUESTED_REF -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Windows Release builds must use a version tag such as v1.4.206; received '$env:REQUESTED_REF'."
          }
          $version = $env:REQUESTED_REF.Substring(1)
          "ORCA_LOCAL_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ORCA_RELEASE_TAG=$env:REQUESTED_REF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved release version: $version"

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run ensure:electron-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Create or reuse release
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $matches = @($releases | Where-Object { $_.tag_name -eq $env:ORCA_RELEASE_TAG })
          if ($matches.Count -gt 1) {
            throw "Found $($matches.Count) GitHub releases for $env:ORCA_RELEASE_TAG. Delete the duplicate release records before uploading Windows assets."
          }
          if ($matches.Count -eq 0) {
            gh release create $env:ORCA_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:ORCA_RELEASE_TAG --notes "Windows installer build for $env:ORCA_RELEASE_TAG."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Created release $env:ORCA_RELEASE_TAG."
          } else {
            Write-Host "Reusing existing release $env:ORCA_RELEASE_TAG."
          }

      - name: Upload Windows release assets
        shell: pwsh
        run: |
          gh release upload $env:ORCA_RELEASE_TAG `
            "dist/orca-windows-setup.exe" `
            "dist/orca-windows-setup.exe.blockmap" `
            "dist/latest.yml" `
            --clobber `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-installer-${{ github.run_number }}
          path: dist/orca-windows-setup.exe
          if-no-files-found: error
          retention-days: 14
